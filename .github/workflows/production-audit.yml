name: Production QA Audit

on:
  push:
    branches: ["audit/production-qa-2026-09-06"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Yarn
        run: npm install -g yarn@1.22.22
      - name: Dependencies
        run: yarn install --frozen-lockfile
      - name: Static repository inventory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          exts={'.js','.jsx','.ts','.tsx','.css','.scss'}
          roots=[Path('pages'),Path('src')]
          files=[p for root in roots if root.exists() for p in root.rglob('*') if p.is_file() and p.suffix in exts]
          text={str(p):p.read_text(encoding='utf-8',errors='ignore') for p in files}
          page_files=[p for p in files if str(p).startswith('pages/') and p.suffix in {'.js','.jsx','.ts','.tsx'} and not p.name.startswith('_') and '/api/' not in str(p)]
          static_routes=[]
          for p in page_files:
            rel=p.relative_to('pages').with_suffix('')
            parts=list(rel.parts)
            if any('[' in x or ']' in x for x in parts): continue
            if parts[-1]=='index': parts=parts[:-1]
            route='/'+'/'.join(parts)
            static_routes.append(route if route!='/' else '/')
          def n(rx): return sum(len(re.findall(rx,s,re.I|re.M)) for s in text.values())
          inv={
            'source_files':len(files),
            'page_files':len(page_files),
            'static_routes':len(set(static_routes)),
            'components':sum(1 for p in files if '/components/' in str(p).replace('\\','/')),
            'forms':n(r'<(?:form|Formik|TextField|Select|Checkbox|Radio)\b'),
            'buttons_links':n(r'<(?:Button|IconButton|button|a|Link)\b'),
            'dialogs_drawers':n(r'<(?:Dialog|Modal|Drawer|BottomSheet|Popover|Menu)\b'),
            'loaders_skeletons':n(r'\b(?:Skeleton|CircularProgress|LinearProgress|loading|spinner|Lottie)\b'),
            'animations_transitions':n(r'\b(?:transition|animation|Fade|Slide|Collapse|Grow|Zoom|CSSTransition|TransitionGroup)\b'),
            'console_calls':n(r'console\.(?:log|warn|error|debug)\s*\('),
            'important_rules':n(r'!important'),
            'zindex_rules':n(r'zIndex\s*:|z-index\s*:'),
            'absolute_fixed_sticky':n(r'position\s*:\s*["\']?(?:absolute|fixed|sticky)|position\s*:\s*(?:absolute|fixed|sticky)'),
            'hardcoded_font_px':n(r'fontSize\s*:\s*["\']?\d+(?:\.\d+)?px|font-size\s*:\s*\d+(?:\.\d+)?px'),
            'hardcoded_dimensions_px':n(r'\b(?:width|height|minWidth|maxWidth|minHeight|maxHeight)\s*:\s*["\']?\d{2,}(?:\.\d+)?px'),
            'text_transform':n(r'textTransform\s*:|text-transform\s*:'),
            'overflow_rules':n(r'overflow(?:X|Y)?\s*:|overflow(?:-x|-y)?\s*:'),
            'mui_media_queries':n(r'useMediaQuery\s*\(|breakpoints\.(?:up|down|between|only)\s*\('),
            'aria_attributes':n(r'aria-[a-z-]+\s*='),
            'alt_attributes':n(r'\balt\s*='),
          }
          risks=[]
          checks=[('console',r'console\.(?:log|warn|error|debug)\s*\(',2),('important',r'!important',2),('zindex',r'zIndex\s*:\s*(?:[1-9]\d{2,})|z-index\s*:\s*(?:[1-9]\d{2,})',2),('absolute_fixed',r'position\s*:\s*["\']?(?:absolute|fixed)',1),('large_font',r'fontSize\s*:\s*["\']?(?:[3-9]\d|\d{3,})px',2),('fixed_dimension',r'\b(?:width|height)\s*:\s*["\']?(?:[5-9]\d\d|\d{4,})px',2)]
          for p,s in text.items():
            score=0; sig=[]
            for tag,rx,w in checks:
              c=len(re.findall(rx,s,re.I))
              if c: score+=min(c,5)*w; sig.append(f'{tag}:{c}')
            if score>=4: risks.append({'file':p,'score':score,'signals':sig})
          risks.sort(key=lambda x:(-x['score'],x['file']))
          report={'inventory':inv,'static_routes':sorted(set(static_routes)),'high_risk_files':risks[:160]}
          Path('audit-static.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY
      - name: ESLint
        shell: bash
        run: |
          set +e
          yarn lint 2>&1 | tee eslint.txt
          echo ${PIPESTATUS[0]} > eslint.exit
          exit 0
      - name: TypeScript check
        shell: bash
        run: |
          set +e
          yarn type-check 2>&1 | tee typecheck.txt
          echo ${PIPESTATUS[0]} > typecheck.exit
          exit 0
      - name: Production build
        shell: bash
        run: |
          set +e
          yarn build 2>&1 | tee build.txt
          echo ${PIPESTATUS[0]} > build.exit
          exit 0
      - name: Browser QA setup
        if: always()
        shell: bash
        run: |
          if [ "$(cat build.exit)" != "0" ]; then
            echo "Build failed; browser QA skipped." | tee browser-qa.txt
            exit 0
          fi
          npm install --no-save --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit
          nohup yarn start -p 3000 > server.txt 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000 >/dev/null && break; sleep 1; done
          cat > /tmp/browser-audit.mjs <<'JS'
          import fs from 'fs';
          import { chromium, firefox, webkit } from 'playwright';
          const staticReport=JSON.parse(fs.readFileSync('audit-static.json','utf8'));
          const routes=staticReport.static_routes;
          const base='http://127.0.0.1:3000';
          const widths=[320,360,375,390,393,412,430,480,768,1024,1280,1440];
          const results=[];
          async function inspect(browserType,name,widthList){
            const browser=await browserType.launch({headless:true});
            for(const width of widthList){
              const context=await browser.newContext({viewport:{width,height:Math.max(700,Math.round(width*1.8))}});
              for(const route of routes){
                const page=await context.newPage();
                const consoleErrors=[]; const pageErrors=[]; const failed=[];
                page.on('console',m=>{if(['error','warning'].includes(m.type())) consoleErrors.push(m.text().slice(0,400));});
                page.on('pageerror',e=>pageErrors.push(String(e).slice(0,400)));
                page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} :: ${r.failure()?.errorText||''}`.slice(0,500)));
                let status=null, navError=null;
                try{ const resp=await page.goto(base+route,{waitUntil:'domcontentloaded',timeout:15000}); status=resp?.status()??null; await page.waitForTimeout(700);}catch(e){navError=String(e).slice(0,500);}
                let metrics={};
                if(!navError){
                  try{metrics=await page.evaluate(()=>{
                    const doc=document.documentElement;
                    const body=document.body;
                    const overflowX=Math.max(doc.scrollWidth,body?.scrollWidth||0)-window.innerWidth;
                    const brokenImages=[...document.images].filter(i=>i.complete&&i.naturalWidth===0).slice(0,20).map(i=>i.currentSrc||i.src||'');
                    const clipped=[];
                    const oversized=[];
                    const smallTargets=[];
                    for(const el of document.querySelectorAll('body *')){
                      const cs=getComputedStyle(el); if(cs.display==='none'||cs.visibility==='hidden') continue;
                      const r=el.getBoundingClientRect(); if(r.width<1||r.height<1) continue;
                      if((el.scrollWidth-el.clientWidth>3||el.scrollHeight-el.clientHeight>3) && ['hidden','clip'].includes(cs.overflow) && el.textContent?.trim()){
                        clipped.push({tag:el.tagName,text:el.textContent.trim().slice(0,120),cw:el.clientWidth,sw:el.scrollWidth,ch:el.clientHeight,sh:el.scrollHeight});
                      }
                      if(r.right>window.innerWidth+3||r.left<-3) oversized.push({tag:el.tagName,text:(el.textContent||'').trim().slice(0,80),left:Math.round(r.left),right:Math.round(r.right),w:Math.round(r.width)});
                    }
                    for(const el of document.querySelectorAll('button,a,input,select,textarea,[role="button"]')){
                      const r=el.getBoundingClientRect(); const cs=getComputedStyle(el); if(cs.display==='none'||cs.visibility==='hidden'||r.width<1||r.height<1) continue;
                      if(r.width<44||r.height<44) smallTargets.push({tag:el.tagName,text:(el.textContent||el.getAttribute('aria-label')||'').trim().slice(0,80),w:Math.round(r.width),h:Math.round(r.height)});
                    }
                    return {overflowX,brokenImages,clipped:clipped.slice(0,30),oversized:oversized.slice(0,30),smallTargets:smallTargets.slice(0,30),title:document.title,url:location.href};
                  });}catch(e){metrics.evaluateError=String(e).slice(0,500);}
                }
                const issue=navError||pageErrors.length||consoleErrors.length||metrics.overflowX>3||metrics.brokenImages?.length||metrics.clipped?.length||metrics.oversized?.length;
                if(issue) results.push({browser:name,width,route,status,navError,consoleErrors:consoleErrors.slice(0,10),pageErrors:pageErrors.slice(0,10),failed:failed.slice(0,10),...metrics});
                await page.close();
              }
              await context.close();
            }
            await browser.close();
          }
          await inspect(chromium,'chromium',widths);
          await inspect(firefox,'firefox',[390,1440]);
          await inspect(webkit,'webkit',[390,1440]);
          fs.writeFileSync('browser-qa.json',JSON.stringify({routesChecked:routes.length,results},null,2));
          console.log(JSON.stringify({routesChecked:routes.length,issues:results.length},null,2));
          JS
          node /tmp/browser-audit.mjs 2>&1 | tee browser-qa.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Production QA Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "ESLint exit: $(cat eslint.exit 2>/dev/null || echo n/a)" >> "$GITHUB_STEP_SUMMARY"
          echo "Typecheck exit: $(cat typecheck.exit 2>/dev/null || echo n/a)" >> "$GITHUB_STEP_SUMMARY"
          echo "Build exit: $(cat build.exit 2>/dev/null || echo n/a)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          head -140 audit-static.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -80 browser-qa.txt >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-audit
          path: |
            audit-static.json
            eslint.txt
            eslint.exit
            typecheck.txt
            typecheck.exit
            build.txt
            build.exit
            server.txt
            browser-qa.txt
            browser-qa.json
