name: React Focused Runtime Smoke

on:
  push:
    branches: [main]
    paths:
      - ".qa/browser-audit.mjs"
      - ".qa/fixtures.mjs"
      - "scripts/check-qa-fixture-contracts.mjs"
      - "pages/home/index.js"
      - "src/components/layout/MainLayout.js"
      - "tests/home-ai-chat-singleton.test.mjs"
      - "src/components/ai-chatbot/ChatBotPopover.tsx"
      - "src/components/ai-chatbot/ChatDetailView.tsx"
      - "src/components/ai-chatbot/singleFlightGate.mjs"
      - "tests/ai-chat-single-flight.test.mjs"
      - "src/components/ai-chatbot/AiChatBotLauncher.tsx"
      - "src/components/ai-chatbot/ChatListView.tsx"
      - ".qa/interactions.mjs"
      - ".qa/mock-server.mjs"
      - "tests/ai-chat-a11y-qa.test.mjs"
      - "src/components/footer/footer-middle/**"
      - ".github/workflows/react-focused-runtime-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - ".qa/browser-audit.mjs"
      - ".qa/fixtures.mjs"
      - "scripts/check-qa-fixture-contracts.mjs"
      - "pages/home/index.js"
      - "src/components/layout/MainLayout.js"
      - "tests/home-ai-chat-singleton.test.mjs"
      - "src/components/ai-chatbot/ChatBotPopover.tsx"
      - "src/components/ai-chatbot/ChatDetailView.tsx"
      - "src/components/ai-chatbot/singleFlightGate.mjs"
      - "tests/ai-chat-single-flight.test.mjs"
      - "src/components/ai-chatbot/AiChatBotLauncher.tsx"
      - "src/components/ai-chatbot/ChatListView.tsx"
      - ".qa/interactions.mjs"
      - ".qa/mock-server.mjs"
      - "tests/ai-chat-a11y-qa.test.mjs"
      - "src/components/footer/footer-middle/**"
      - ".github/workflows/react-focused-runtime-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-root-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_BROWSERS: chromium
      QA_WIDTHS: "390"
      QA_ROUTES: "/,/home,/checkout"
      QA_SKIP_INTERACTIONS: "0"
      QA_VERBOSE_ERRORS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - run: npm install -g yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - run: npm ci --prefix .qa
      - run: node .qa/node_modules/playwright/cli.js install --with-deps chromium
      - run: python3 .qa/inventory.py
      - name: Validate synthetic API fixtures against Backend V4.2 wire shapes
        run: node scripts/check-qa-fixture-contracts.mjs
      - name: Guard against duplicate floating AI assistant
        run: node --test tests/home-ai-chat-singleton.test.mjs
      - name: Run production-build homepage hydration smoke
        run: node .qa/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-root-smoke
          path: .qa/results/
          if-no-files-found: warn
